name: Build ImmortalWrt 24.10.4 Final

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: 1.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Get current date
      id: date
      run: |
        echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev \
          file wget curl zstd ccache qemu-utils
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: Cache dl & ccache
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          ~/.ccache
        # 使用 env.DATE 来实现每日更新
        key: ${{ runner.os }}-immortalwrt-${{ env.REPO_BRANCH }}-${{ hashFiles('**/2.config') }}-${{ env.DATE }}
        restore-keys: |
          ${{ runner.os }}-immortalwrt-${{ env.REPO_BRANCH }}-${{ hashFiles('**/2.config') }}-
          ${{ runner.os }}-immortalwrt-${{ env.REPO_BRANCH }}-

    - name: Update & Install Feeds
      working-directory: ./openwrt
      run: |
        echo "src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main" >> feeds.conf.default
        echo "src-git passwall_luci https://github.com/xiaorouji/openwrt-passwall.git;main" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Force Upgrade Golang
      working-directory: ./openwrt
      run: |
        rm -rf feeds/packages/lang/golang
        git clone https://github.com/sbwml/packages_lang_golang feeds/packages/lang/golang
        ./scripts/feeds update -i golang
        ./scripts/feeds install -i golang

    - name: Custom Configuration
      working-directory: ./openwrt
      run: |
        git clone -b v2.4.3 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
        sed -i 's/192.168.1.1/192.168.100.1/g' package/base-files/files/bin/config_generate
        [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        echo "CONFIG_CCACHE=y" >> .config
        echo "CONFIG_CCACHE_DIR=\"$HOME/.ccache\"" >> .config
        make defconfig

    - name: Download Library
      working-directory: ./openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      working-directory: ./openwrt
      run: |
        ccache -M 5G
        make -j$(nproc) || make -j1 V=s
        ccache -s

    - name: Organize files
      working-directory: ./openwrt
      run: |
        mkdir -p ./artifact/
        # 打包所有 bin/targets/x86/64/ 目录下的非目录文件（即镜像、json、buildinfo 等）
        find bin/targets/x86/64/ -maxdepth 1 -type f -exec cp -v {} ./artifact/ \;
        cp .config ./artifact/config.build

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_24.10_X86_Images
        path: ./openwrt/artifact/